{% extends 'base.html' %}

{% block content %}


<section id="tourSection">

    <div class="carousel">
        
        <div class="back">
            <img id="back"
                src="{{ url_for('static', filename='IMG/atras.svg') }}"
                alt="back" loading="lazy">
        </div>

        <div class="images">
            <div id="img">
                <img class="img" src="{{ url_for('static', filename='IMG/jetsky.jpeg') }}" alt="Jetsky" id="jetsky" loading="lazy">
            </div>

            <div class="text" id="text">
                <h3>Jetsky</h3>
                <p>Is an acuatic sport for max of two person peer vehicle, this adventure had a limited
                    time of <time datetime="PT40M">40M</time>, you had a range where you can move freely.</p>
            </div>
        </div>

        <div id="foward" class="foward">
            <img src="{{ url_for('static', filename='IMG/adelante.svg') }}"
                alt="foward" loading="lazy">
        </div>

        <div id="points" class="points">
        </div>
    </div>

</section>

{% endblock %}
